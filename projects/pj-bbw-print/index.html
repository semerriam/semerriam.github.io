        p {

        /* Print layouts — one wide spread per row, caption underneath */

        .spreads {
            max-width: 1000px;
            padding-left: 5%;
            padding-right: 5%;
            margin: 40px auto 0;
        }

            .spread {
                margin: 0 0 70px 0;
            }

                .spread img {
                    display: block;
                    width: 100%;
                    height: auto;
                    border: 1px solid #e5e5e5;
                    box-sizing: border-box;
                }

                /* Caption: title on the left, details + credits on the right */
                .spread figcaption {
                    display: grid;
                    grid-template-columns: 1fr 2fr;
                    column-gap: 30px;
                    margin-top: 14px;
                    font-size: 14px;
                    line-height: 20px;
                }

                    .spread .title {
                        font-size: 18px;
                        line-height: 24px;
                        font-weight: 600;
                    }

                    .spread .details,
                    .spread .credits {
                        margin: 0;
                    }

                    .spread .details span {
                        display: block;
                    }

                    .spread .details .issue {
                        color: #999;
                        font-size: 12px;
                        text-transform: uppercase;
                        font-family: DecimaMono,Consolas,Monaco,monospace;
                    }

                    .spread .credits {
                        margin-top: 10px;
                        color: #6d6f71;
                    }

                        .spread .credits dt {
                            display: inline;
                        }

                        .spread .credits dt::after {
                            content: ": ";
                        }

                        .spread .credits dd {
                            display: inline;
                            margin: 0;
                            color: #222;
                        }

                        .spread .credits dd::after {
                            content: "";
                            display: block;
                        }

                    .spread a:hover {
                        background-color: #bfe6ff;
                        transition: all 0.2s ease-in-out;
                    }

                @media screen and (max-width:600px){
                    .spread figcaption { grid-template-columns: 1fr; row-gap: 6px; }
                }


        hr {
            height: 1px;
